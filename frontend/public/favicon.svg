<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
  <!-- Isometric/Stylized 3D Die / Board Token -->
  <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#gold)" />
  <!-- Die Pips (Dots) -->
  <circle cx="22" cy="22" r="3.5" fill="#0F172A"/>
  <circle cx="42" cy="22" r="3.5" fill="#0F172A"/>
  <circle cx="32" cy="32" r="3.5" fill="#0F172A"/>
  <circle cx="22" cy="42" r="3.5" fill="#0F172A"/>
  <circle cx="42" cy="42" r="3.5" fill="#0F172A"/>
</svg>
